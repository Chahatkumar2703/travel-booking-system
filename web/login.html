<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - VoyageQuest Travel Booking Platform</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-container {
      max-width: 440px;
      margin: 50px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 35px 30px;
      box-shadow: var(--shadow-lg);
    }
    .auth-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }
    .demo-accounts-box {
      background: var(--primary-light);
      border: 1px dashed #93c5fd;
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-top: 25px;
      font-size: 0.82rem;
    }
    .demo-accounts-box h4 {
      font-size: 0.85rem;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }
    .demo-btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Demo Bar -->
  <div class="demo-bar">
    <span>🎓 <b>College Project Demo Mode</b></span>
    <div>
      <a href="index.html">← Back to Public Website</a>
    </div>
  </div>

  <div class="container">
    <div class="auth-container">
      <div style="text-align:center; font-size:2.2rem; margin-bottom:10px;">✈</div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to manage your bookings, listings, or platform.</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" required placeholder="name@example.com" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••" />
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="padding:10px; margin-top:10px;">
          Sign In
        </button>
      </form>

      <p style="text-align:center; font-size:0.88rem; margin-top:20px; color:var(--text-muted);">
        Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Register here</a>
      </p>

      <!-- Viva Demo Fast Login Selectors -->
      <div class="demo-accounts-box">
        <h4>🎓 Quick Viva Presentation Logins:</h4>
        <p style="color:#475569; margin-bottom:6px;">Click any demo role to fill & sign in instantly:</p>
        <div class="demo-btn-group">
          <button class="btn btn-sm btn-outline" style="background:#fff; justify-content:flex-start;"
                  onclick="quickFillAndLogin('traveler@example.com', 'traveler123', 'traveler-dashboard.html')">
            👤 <b>Traveler:</b> traveler@example.com
          </button>
          <button class="btn btn-sm btn-outline" style="background:#fff; justify-content:flex-start;"
                  onclick="quickFillAndLogin('agent@example.com', 'agent123', 'agent-dashboard.html')">
            🏢 <b>Travel Agent:</b> agent@example.com
          </button>
          <button class="btn btn-sm btn-outline" style="background:#fff; justify-content:flex-start;"
                  onclick="quickFillAndLogin('admin@example.com', 'admin123', 'admin-dashboard.html')">
            🛡 <b>Administrator:</b> admin@example.com
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';

      try {
        const res = await API.login(email, password);
        if (res && res.success && res.user) {
          Auth.setUser(res.user, res.token);
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            if (res.user.role === 'ADMIN') window.location.href = 'admin-dashboard.html';
            else if (res.user.role === 'AGENT') window.location.href = 'agent-dashboard.html';
            else window.location.href = 'traveler-dashboard.html';
          }, 800);
        } else {
          showToast((res && (res.message || res.error)) || 'Login failed. Please check your credentials.', 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (err) {
        showToast('Unable to connect to backend server: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function quickFillAndLogin(email, password, redirectUrl) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = password;
      const res = await API.login(email, password);
      if (res && res.success && res.user) {
        Auth.setUser(res.user);
        window.location.href = redirectUrl;
      } else {
        showToast('Demo login error: ' + ((res && (res.message || res.error)) || 'Unknown error'), 'error');
      }
    }
  </script>
</body>
</html>
